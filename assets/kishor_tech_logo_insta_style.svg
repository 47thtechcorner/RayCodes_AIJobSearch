<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Instagram-Inspired Cyber Tech Radial/Linear Blend -->
    <linearGradient id="instaTechGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="35%" stop-color="#7c3aed"/>
      <stop offset="70%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <radialGradient id="instaSunGlow" cx="20%" cy="100%" r="90%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#f97316" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#instaTechGrad)"/>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#instaSunGlow)"/>
  <rect x="5" y="5" width="118" height="118" rx="29" fill="none" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1.5"/>

  <!-- Center White Glyph: Precision K-Tech Icon with Lens Element -->
  <g transform="translate(32, 28)" fill="#ffffff">
    <!-- Vertical Pillar -->
    <rect x="4" y="4" width="10" height="64" rx="3"/>
    
    <!-- Upper Diagonal -->
    <polygon points="12,40 46,6 58,6 22,46"/>

    <!-- Lower Diagonal with Insta-Style Aperture/Lens Cutout -->
    <polygon points="20,38 52,70 40,70 11,41"/>
    <circle cx="56" cy="14" r="6" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="56" cy="14" r="2.2" fill="#ffffff"/>
  </g>
</svg>