<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="45%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="glyphGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ffffff" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Squircle Base with Metallic Stroke (Like X icon) -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgSheen)" stroke="#27272a" stroke-width="2"/>
  <rect x="5.5" y="5.5" width="117" height="117" rx="26.5" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>

  <!-- Geometric "X"-Style Monogram for kishor.tech -->
  <g transform="translate(32, 28)" fill="url(#glyphGlow)" filter="url(#subtleGlow)">
    <!-- Solid Left Stem Pillar -->
    <path d="M 4 2 C 5.5 2 7 3.5 7 5 L 7 67 C 7 68.5 5.5 70 4 70 L 2 70 C 0.5 70 -1 68.5 -1 67 L -1 5 C -1 3.5 0.5 2 2 2 Z"/>
    <path d="M 5 2 L 13 2 L 13 70 L 5 70 Z" fill="#ffffff"/>

    <!-- Upper Diagonal (Solid Blade) -->
    <polygon points="12,41 46,6 59,6 23,47" fill="#ffffff"/>

    <!-- Lower Diagonal (Double-Struck Mathematical Stroke - Official 𝕏 Aesthetic) -->
    <!-- Line 1 -->
    <polygon points="20,38 52,70 42,70 12,42" fill="#ffffff"/>
    <!-- Line 2 (Parallel Accent) -->
    <polygon points="28,34 60,70 54,70 23,38" fill="rgba(255, 255, 255, 0.75)"/>

    <!-- Superscript "T" for Tech -->
    <path d="M 54 2 L 67 2 L 67 6 L 62 6 L 62 16 L 59 16 L 59 6 L 54 6 Z" fill="#38bdf8"/>
  </g>
</svg>